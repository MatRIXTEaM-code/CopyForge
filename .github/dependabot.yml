# Weekly checks for newer versions of the GitHub Actions and NuGet packages the build uses,
# including security fixes. Dependabot opens a pull request; nothing changes until it is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
