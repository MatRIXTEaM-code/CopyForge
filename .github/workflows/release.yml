name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet run --project tests/CopyForge.SmokeTest -c Release
      - name: Publish
        run: |
          dotnet publish src/CopyForge.App -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o out
          dotnet publish src/CopyForge.Cli -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o out
          cd out
          Get-FileHash CopyForge.exe,cfcopy.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File SHA256SUMS.txt -Encoding ascii
          $sums = Get-Content SHA256SUMS.txt -Raw
          "## SHA-256 checksums`n`n``````n$sums``````n`nCheck a download with: ``Get-FileHash CopyForge.exe -Algorithm SHA256``" | Out-File notes.md -Encoding utf8
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            out/CopyForge.exe
            out/cfcopy.exe
            out/SHA256SUMS.txt
          body_path: out/notes.md
          generate_release_notes: true
