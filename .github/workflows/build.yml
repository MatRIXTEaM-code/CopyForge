name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build CopyForge.slnx -c Release
      - name: Smoke tests
        run: dotnet run --project tests/CopyForge.SmokeTest -c Release
      - name: Publish
        run: |
          dotnet publish src/CopyForge.App -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o out/app
          dotnet publish src/CopyForge.Cli -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o out/cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CopyForge-win-x64
          path: |
            out/app/CopyForge.exe
            out/cli/cfcopy.exe
